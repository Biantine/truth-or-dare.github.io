            border-radius: 30px;
            background: #ffc0cb;
            color: #8b0000;
            font-size: 18px;
            font-weight: 600;

            transition: 0.2s;
            user-select: none;

            font-size: 14px;
            font-weight: 500;

            background: #ffc0cb;
            color: #8b0000;
            font-size: 17px;

            border: none;
            color: #b0a090;

        }

</head>

                "和一位异性玩\"传纸巾\"游戏，用嘴传递",
                "在一位异性耳边低语三句最露骨的情话",
                "用手机拍一张\"最撩人\"的照片，发到群里",
                "闭上眼睛，让一位异性用舌头在你脸上画圈",
                "模仿\"骑马\"动作，在一位异性背上做10下",
                "用一条丝巾蒙住一位异性的眼睛，然后用手抚摸他/她",
                "和一位异性假装在公共场所偷偷亲热（仅表演）",
                "用嘴咬住衣服下摆，露出腹部，保持10秒",
                "对一位异性说\"我要把你扑倒\"并做动作",
                "用两根手指抬起一位异性的下巴，说\"我要你\"",
                "和一位异性用身体夹住一个气球并挤破",
                "模仿\"69\"姿势（不接触），保持10秒",
                "把一位异性的手放在自己臀部上3秒",
                "用嘴巴含一口水，淋在一位异性的手上",
                "和一位异性跳一支\"脱衣舞\"（只脱外套）",
                "用最性感的声音读一段色情小说",
                "在一位异性身上用口红写一个字",
                "和一位异性玩\"真心话大冒险\"的接吻游戏（贴嘴唇3秒）",
                "用手机播放一段AV配音，自己模仿声音",
                "把一位异性按在墙上，说\"你逃不掉了\"",
                "用围巾缠住一位异性的眼睛，然后喂他/她吃东西",
                "和一位异性互相喂酒（交杯酒升级版）",
                "模仿被\"打屁股\"时的反应，声音要响",
                "用一根手指从异性的锁骨滑到肚脐",
                "和一位异性共同完成一次\"壁咚+强吻\"表演",
                "用脚趾给一位异性发一条消息（打字）",
                "在一位异性的手背上画一个\"爱心\"并亲吻",
                "穿着袜子在地上滑行，像做爱的动作",
                "和一位异性用同一副耳机听一首歌，并合唱",
                "模仿\"高潮\"的表情，持续10秒",
                "把一位异性的手放在自己胸口，说\"感受我的心跳\"",
                "用胶带粘住自己的嘴，然后向异性表白（比划）",
                "和一位异性面对面，双手撑墙做俯卧撑（双人）",
                "用手机的手电筒照射一位异性的身体，从脚到头",
                "在一位异性的肚子上放一块饼干，用嘴吃掉",
                "模仿\"被捆绑后挣扎\"的声音",
                "和一位异性共同跳一段\"枕头舞\"（用枕头做道具）",
                "把一位异性的鞋脱掉，亲吻他的脚背",
                "用电话给一个联系人发语音：\"我想和你做爱\"",
                "和一位异性一起做一个\"双人瑜伽\"亲密体式",
                "用嘴叼住一张扑克牌，让异性用嘴接住",
                "在一位异性的脖子上吹气并轻轻咬一下",
                "和一位异性互换一件贴身衣物（袜子、围巾等）",
                "用最诱人的姿势趴在沙发上10秒",
                "对一位异性说\"我要和你生猴子\"并眨眼",
                "用一只手解开自己的纽扣，再用另一只手解开异性的",
                "模仿\"被抚摸\"时的呻吟，持续15秒",
                "和一位异性共同喝一杯酒，必须同时喝",
                "用丝巾蒙住自己的眼睛，让异性指挥你走一圈",
                "在一位异性的背上用指甲轻轻划出\"I ❤ U\"",
                "和一位异性十指相扣，做5个深蹲",
                "用嘴巴含住一根筷子，让异性夹走",
                "对一位异性说\"我要让你求饶\"",
                "和一位异性互相给对方涂口红（或润唇膏）",
                "用手机计时，和一位异性比赛谁先脸红（对视）",
                "在一位异性的手掌心画圈，直到他/她痒笑",
                "和一位异性共同完成一次\"公主抱\"并转圈",
                "用脚夹住手机，拍一张自拍",
                "模仿被\"调教\"时的对话",
                "和一位异性头碰头，互相说一句最色的话",
                "用皮带或领带轻轻抽打自己的手（道具）",
                "在一位异性的耳边吹气，并说\"痒吗？\"",
                "和一位异性一起做一次\"贴身热舞\"30秒",
                "用嘴巴从桌上叼起一朵花，送给一位异性",
                "和一位异性闭眼互相抚摸对方的头发和脸颊",
                "模仿\"脱衣舞娘\"的动作（只脱外衣）",
                "把一位异性的手放在自己的大腿上，保持10秒",
                "用饮料瓶当麦克风，唱一首情歌给异性听",
                "和一位异性一起做一个\"背后拥抱\"的姿势",
                "用牙齿解开一位异性的手表或手链",
                "在一位异性的背上用口红画一颗心",
                "和一位异性共同完成一次\"膝枕\"三分钟（躺对方腿上）",
                "对一位异性说\"今晚我就是你的\"并做飞吻"
            ]
        };

        // ============================================================
        //  2. 游戏状态
        // ============================================================
        const state = {
            tier: '一档', // '一档' | '二档' | '三档'
            truth: '',
            dare: ''
        };

        // ============================================================
        //  3. DOM 引用
        // ============================================================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const truthContent = $('#truthContent');
        const dareContent = $('#dareContent');
        const truthTag = $('#truthTag');
        const dareTag = $('#dareTag');
        const currentTierLabel = $('#currentTierLabel');
        const tierBtns = $$('.tier-btn');
        const drawTruthBtn = $('#drawTruthBtn');
        const drawDareBtn = $('#drawDareBtn');
        const resetBtn = $('#resetBtn');

        // ============================================================
        //  4. 渲染函数
        // ============================================================
        function render() {
            // 更新档位标签
            const tierLabel = state.tier;
            truthTag.textContent = `【当前档位：${tierLabel}】`;
            dareTag.textContent = `【当前档位：${tierLabel}】`;
            currentTierLabel.textContent = `当前选中：${tierLabel}`;

            // 更新档位按钮高亮
            tierBtns.forEach(btn => {
                const tier = btn.dataset.tier;
                btn.classList.toggle('active', tier === state.tier);
            });

            // 更新真心话内容
            if (state.truth) {
                truthContent.innerHTML = `"${escapeHtml(state.truth)}"`;
                truthContent.className = 'card-content pop';
                setTimeout(() => truthContent.classList.remove('pop'), 350);
            } else {
                truthContent.innerHTML = `<span class="empty-icon">❓</span>`;
                truthContent.className = 'card-content';
            }

            // 更新大冒险内容
            if (state.dare) {
                dareContent.innerHTML = `"${escapeHtml(state.dare)}"`;
                dareContent.className = 'card-content pop';
                setTimeout(() => dareContent.classList.remove('pop'), 350);
            } else {
                dareContent.innerHTML = `<span class="empty-icon">❓</span>`;
                dareContent.className = 'card-content';
            }
        }

        // 简单的防XSS转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  5. 核心操作
        // ============================================================
        function setTier(tier) {
            if (state.tier === tier) return;
            state.tier = tier;
            render();
        }

        function drawTruth() {
            const pool = POOL[state.tier];
            if (!pool || !pool.truth || pool.truth.length === 0) {
                state.truth = '（暂无题目）';
            } else {
                const list = pool.truth;
                state.truth = list[Math.floor(Math.random() * list.length)];
            }
            render();
        }

        function drawDare() {
            const pool = POOL[state.tier];
            if (!pool || !pool.dare || pool.dare.length === 0) {
                state.dare = '（暂无题目）';
            } else {
                const list = pool.dare;
                state.dare = list[Math.floor(Math.random() * list.length)];
            }
            render();
        }

        function resetContent() {
            state.truth = '';
            state.dare = '';
            render();
        }

        // ============================================================
        //  6. 事件绑定
        // ============================================================
        tierBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setTier(btn.dataset.tier);
            });
        });

        drawTruthBtn.addEventListener('click', drawTruth);
        drawDareBtn.addEventListener('click', drawDare);
        resetBtn.addEventListener('click', resetContent);

        // 键盘快捷键：1,2,3 切换档位；T 抽真心话；D 抽大冒险；R 重置
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const key = e.key.toLowerCase();
            if (key === '1') setTier('一档');
            else if (key === '2') setTier('二档');
            else if (key === '3') setTier('三档');
            else if (key === 't') { e.preventDefault();
                drawTruth(); } else if (key === 'd') { e.preventDefault();
                drawDare(); } else if (key === 'r') { e.preventDefault();
                resetContent(); }
        });

        // ============================================================
        //  7. 初始化
        // ============================================================
        render();
        console.log('🎉 真心话大冒险已启动！');
        console.log('快捷键: 1/2/3 切换档位 | T 抽真心话 | D 抽大冒险 | R 重置');
    </script>
